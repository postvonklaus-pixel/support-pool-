<!DOCTYPE html>
<html lang="de" dir="ltr">
<head>
  <meta charset="UTF-8">
  <base href="/support-pool-/">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NOVA Pool">
  <meta name="description" content="Das Premium TikTok Support-Netzwerk">
  <title>NOVA Support Pool</title>

  <!-- Icons & Manifest -->
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">

  <!-- CSS -->
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/screens/login.css">
  <link rel="stylesheet" href="css/screens/dashboard.css">
  <link rel="stylesheet" href="css/screens/home.css">
  <link rel="stylesheet" href="css/screens/profile.css">
  <link rel="stylesheet" href="css/screens/admin.css">
  <link rel="stylesheet" href="css/screens/settings.css">
  <link rel="stylesheet" href="css/screens/myvideos.css">
  <link rel="stylesheet" href="css/screens/caption.css">
</head>
<body>

<!-- ── LOADING SPLASH ──────────────────────────────────── -->
<div id="app-loading">
  <div class="loader-logo">NOVA</div>
  <div class="loader-spinner"></div>
</div>

<!-- ── TOAST CONTAINER ─────────────────────────────────── -->
<div id="toast-container" role="status" aria-live="polite"></div>

<!-- ── APP SHELL ───────────────────────────────────────── -->
<div id="app" style="display:none">

  <!-- Header (hidden on login) -->
  <header id="app-header" class="hidden">
    <div class="header-brand">NOVA</div>
    <div class="header-actions">
      <div class="header-status" id="header-online">
        <span class="header-status__dot"></span>
        <span id="t-online">ONLINE</span>
      </div>
      <div class="header-user" data-action="nav:profile">
        <div class="avatar avatar--sm" id="header-avatar" style="background:var(--gradient-primary);color:#fff">N</div>
        <span class="header-user__name truncate" id="header-username">–</span>
      </div>
      <button class="btn btn--icon" data-action="modal:settings" aria-label="Settings" id="header-settings-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14"/></svg>
      </button>
    </div>
  </header>

  <!-- Broadcast Banner -->
  <div id="broadcast-banner" role="alert"></div>

  <!-- Screen Container -->
  <main id="screen-container">

    <!-- LOGIN -->
    <section id="screen-login" class="screen screen--login" role="main">
      <div class="login-hero" aria-hidden="true"></div>
      <div class="login-wrap">
        <!-- Live stats -->
        <div class="login-stats" id="login-stats"></div>

        <!-- Brand -->
        <div class="login-brand">
          <div class="login-brand__logo">NOVA Support Pool</div>
          <div class="login-brand__sub" id="login-sub">Das Premium TikTok Support-Netzwerk</div>
        </div>

        <!-- Glass card -->
        <div class="login-card">
          <!-- Language row -->
          <div class="login-lang-row" id="login-lang-row" role="group" aria-label="Language"></div>

          <!-- Step 1: Name -->
          <div id="login-name-step">
            <div class="login-input-wrap">
              <input
                class="login-input input"
                type="text"
                id="login-name-input"
                autocomplete="off"
                spellcheck="false"
                placeholder="@username"
                aria-label="Username"
                data-action="login:input"
              >
              <div class="login-autocomplete" id="login-autocomplete" role="listbox"></div>
            </div>
            <button class="btn btn--primary btn--full btn--lg" id="login-btn" data-action="login:submit">
              <span id="login-sub">Einloggen</span>
            </button>
          </div>

          <!-- Step 2: PIN (shown after user identified) -->
          <div class="hidden" id="login-pin-step">
            <div class="login-pin__greet" id="pin-greet"></div>
            <div class="login-pin__label" id="pin-label">PIN eingeben</div>
            <div class="pin-dots" id="pin-dots">
              <div class="pin-dot" data-pos="0"></div>
              <div class="pin-dot" data-pos="1"></div>
              <div class="pin-dot" data-pos="2"></div>
              <div class="pin-dot" data-pos="3"></div>
            </div>
            <div class="pin-pad" id="pin-pad">
              <button class="pin-key" data-action="pin:key" data-key="1">1</button>
              <button class="pin-key" data-action="pin:key" data-key="2">2</button>
              <button class="pin-key" data-action="pin:key" data-key="3">3</button>
              <button class="pin-key" data-action="pin:key" data-key="4">4</button>
              <button class="pin-key" data-action="pin:key" data-key="5">5</button>
              <button class="pin-key" data-action="pin:key" data-key="6">6</button>
              <button class="pin-key" data-action="pin:key" data-key="7">7</button>
              <button class="pin-key" data-action="pin:key" data-key="8">8</button>
              <button class="pin-key" data-action="pin:key" data-key="9">9</button>
              <button class="pin-key pin-key--sm" data-action="pin:forgot" id="pin-forgot-link">PIN vergessen?</button>
              <button class="pin-key" data-action="pin:key" data-key="0">0</button>
              <button class="pin-key pin-key--del" data-action="pin:del">⌫</button>
            </div>
          </div>

        </div>
      </div>
    </section>

    <!-- DASHBOARD -->
    <section id="screen-dashboard" class="screen" role="main"></section>

    <!-- HOME (Support Videos) -->
    <section id="screen-home" class="screen" role="main"></section>

    <!-- PROFILE -->
    <section id="screen-profile" class="screen" role="main"></section>

    <!-- MY VIDEOS -->
    <section id="screen-myvideos" class="screen" role="main"></section>

    <!-- CAPTION GENERATOR -->
    <section id="screen-caption" class="screen" role="main"></section>

    <!-- SETTINGS -->
    <section id="screen-settings" class="screen" role="main"></section>

    <!-- ADMIN -->
    <section id="screen-admin" class="screen" role="main"></section>

  </main>

  <!-- Bottom Navigation (hidden on login) -->
  <nav id="app-nav" class="hidden" aria-label="Main navigation">
    <div class="nav-indicator" id="nav-indicator"></div>

    <button class="nav-item" id="ni-home" data-action="nav:goto" data-screen="home" aria-label="Home">
      <span class="nav-item__icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span class="notif-pip hidden" id="nav-home-pip"></span>
      </span>
      <span class="nav-item__label" id="t-nav-home">Home</span>
    </button>

    <button class="nav-item" id="ni-support" data-action="nav:goto" data-screen="home" aria-label="Support">
      <span class="nav-item__icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
      </span>
      <span class="nav-item__label" id="t-nav-support">Videos</span>
    </button>

    <!-- FAB: Post Video -->
    <div class="nav-item nav-item--fab">
      <button class="nav-fab" data-action="post:open" aria-label="Video posten">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
    </div>

    <button class="nav-item" id="ni-profile" data-action="nav:goto" data-screen="profile" aria-label="Profil">
      <span class="nav-item__icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span class="notif-pip hidden" id="nav-profile-pip"></span>
      </span>
      <span class="nav-item__label" id="t-nav-profile">Profil</span>
    </button>

    <button class="nav-item" id="ni-dashboard" data-action="nav:goto" data-screen="dashboard" aria-label="Dashboard">
      <span class="nav-item__icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      </span>
      <span class="nav-item__label" id="t-nav-dash">Board</span>
    </button>
  </nav>

</div><!-- #app -->

<!-- ── MODALS (rendered dynamically by modal.js) ──────── -->
<div id="modal-container"></div>

<!-- ── Firebase SDK ─────────────────────────────────────── -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-functions-compat.js"></script>

<!-- ── App Entry Point ──────────────────────────────────── -->
<script type="module" src="js/main.js"></script>

<!-- ── Hard fallback: if splash still visible after 4s, force-show app ── -->
<script>
(function() {
  // Attach immediately; fires even if module loading is slow
  window.addEventListener('load', function() {
    setTimeout(function() {
      var loading = document.getElementById('app-loading');
      var app     = document.getElementById('app');
      if (loading && loading.parentNode) {
        loading.style.opacity = '0';
        loading.style.pointerEvents = 'none';
        setTimeout(function() { if (loading.parentNode) loading.parentNode.removeChild(loading); }, 300);
      }
      if (app) app.style.display = 'flex';
      // If no screen is active yet, activate login
      var loginScreen = document.getElementById('screen-login');
      var hasActive   = document.querySelector('.screen.active');
      if (loginScreen && !hasActive) {
        loginScreen.classList.add('active');
      }
    }, 4000);
  });
  // Also fire on DOMContentLoaded in case load never fires
  document.addEventListener('DOMContentLoaded', function() {
    setTimeout(function() {
      var app = document.getElementById('app');
      if (app && app.style.display === 'none') app.style.display = 'flex';
    }, 5000);
  });
})();
</script>

</body>
</html>
