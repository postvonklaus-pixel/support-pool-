<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Dark blue background with rounded corners for app icon -->
  <rect width="512" height="512" rx="100" ry="100" fill="#0a1128"/>

  <!-- Inner gradient overlay for depth -->
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#1a2a5e" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0a1128" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="goldBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe066"/>
      <stop offset="30%" stop-color="#ffd700"/>
      <stop offset="65%" stop-color="#c8960c"/>
      <stop offset="100%" stop-color="#a0740a"/>
    </linearGradient>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff3a0"/>
      <stop offset="50%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
    <linearGradient id="goldBase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#8b6914"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background fill -->
  <rect width="512" height="512" rx="100" ry="100" fill="url(#bgGlow)"/>

  <!-- Subtle star/sparkle top center -->
  <circle cx="256" cy="68" r="5" fill="#ffd700" opacity="0.7"/>
  <circle cx="220" cy="88" r="3" fill="#ffd700" opacity="0.45"/>
  <circle cx="292" cy="88" r="3" fill="#ffd700" opacity="0.45"/>

  <!-- === TROPHY === -->
  <!-- Cup handles (left) -->
  <path d="M155 178 Q108 178 108 222 Q108 262 150 265" stroke="url(#goldRim)" stroke-width="22" fill="none" stroke-linecap="round"/>
  <!-- Cup handles (right) -->
  <path d="M357 178 Q404 178 404 222 Q404 262 362 265" stroke="url(#goldRim)" stroke-width="22" fill="none" stroke-linecap="round"/>

  <!-- Cup body - main shape -->
  <path d="M155 130 L357 130 L340 290 Q310 355 256 355 Q202 355 172 290 Z" fill="url(#goldBody)" filter="url(#shadow)"/>

  <!-- Cup body highlight -->
  <path d="M185 130 L325 130 L316 230 Q295 280 256 290 Q217 280 196 230 Z" fill="rgba(255,255,255,0.12)"/>

  <!-- Rim at top of cup -->
  <rect x="145" y="118" width="222" height="28" rx="14" fill="url(#goldRim)" filter="url(#shadow)"/>

  <!-- Stem -->
  <rect x="232" y="355" width="48" height="62" rx="10" fill="url(#goldBase)"/>

  <!-- Base platform -->
  <rect x="168" y="408" width="176" height="30" rx="15" fill="url(#goldBase)" filter="url(#shadow)"/>
  <!-- Base top stripe -->
  <rect x="168" y="408" width="176" height="14" rx="7" fill="url(#goldRim)" opacity="0.6"/>

  <!-- Base bottom foot -->
  <rect x="155" y="432" width="202" height="20" rx="10" fill="url(#goldBase)" filter="url(#shadow)"/>

  <!-- Star on trophy cup -->
  <polygon points="256,162 263,184 286,184 268,197 275,220 256,207 237,220 244,197 226,184 249,184" fill="#fff8dc" filter="url(#glow)" opacity="0.95"/>

  <!-- Shine lines on cup -->
  <line x1="195" y1="148" x2="185" y2="290" stroke="rgba(255,255,255,0.18)" stroke-width="8" stroke-linecap="round"/>
  <line x1="215" y1="143" x2="205" y2="310" stroke="rgba(255,255,255,0.1)" stroke-width="5" stroke-linecap="round"/>
</svg>
