services:
  postgres:
    image: postgres:16-alpine
    container_name: sma_postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sma_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: sma_app
    command: ["python", "main.py"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://user:pass@postgres:5432/db
      REDIS_URL: redis://redis:6379
      WEBHOOK_HOST: 0.0.0.0
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs

  dashboard:
    build: .
    container_name: sma_dashboard
    command: ["streamlit", "run", "dashboard.py", "--server.address=0.0.0.0"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://user:pass@postgres:5432/db
      REDIS_URL: redis://redis:6379
    ports:
      - "8501:8501"
    depends_on:
      postgres:
        condition: service_healthy

  # Stripe-CLI Webhook-Listener: leitet Events vom Stripe-Testmodus an den
  # lokalen app-Service weiter. Benoetigt einen echten STRIPE_SECRET_KEY in
  # .env (im MOCK-Modus nicht erforderlich - dann einfach diesen Service
  # nicht starten, z.B. mit "docker compose up postgres redis app").
  stripe-webhook-listener:
    image: stripe/stripe-cli:latest
    container_name: sma_stripe_listener
    command: ["listen", "--forward-to", "app:8080/webhook", "--api-key", "${STRIPE_SECRET_KEY}"]
    env_file:
      - .env
    depends_on:
      - app

volumes:
  postgres_data:
