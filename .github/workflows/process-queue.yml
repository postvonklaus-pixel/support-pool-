name: Process Video Queue

on:
  schedule:
    # Every 2 hours — ensures queued videos go live without needing a user login.
    - cron: '0 */2 * * *'
  workflow_dispatch:   # Allow manual trigger from Actions tab

jobs:
  process-queue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install firebase-admin
        run: npm install firebase-admin --no-save

      - name: Process scheduled & expired videos
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/process-queue.js
