name: Deploy Firebase Functions

on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'database.rules.json'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2  # Need HEAD~1 for the changed-paths diff below

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Detect changed paths
        id: changes
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
          echo "functions=$(echo "$CHANGED" | grep -c 'functions/' || true)" >> $GITHUB_OUTPUT
          echo "rules=$(echo "$CHANGED" | grep -c 'database.rules.json' || true)" >> $GITHUB_OUTPUT

      - name: Install function dependencies
        if: steps.changes.outputs.functions != '0'
        run: npm install
        working-directory: functions

      - name: Deploy Functions
        if: steps.changes.outputs.functions != '0'
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /tmp/sa.json
          npx firebase-tools@13 deploy \
            --only functions:generateCaption,functions:sendFcmPush,functions:processScheduledVideos,functions:fetchTikTokThumb \
            --non-interactive
          rm -f /tmp/sa.json
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json

      - name: Deploy Database Rules
        if: always() && (steps.changes.outputs.rules != '0' || github.event_name == 'workflow_dispatch')
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /tmp/sa.json
          npx firebase-tools@13 deploy --only database --non-interactive
          rm -f /tmp/sa.json
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json

