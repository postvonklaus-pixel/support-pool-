name: Deploy Firebase Functions

on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'database.rules.json'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Detect changed paths
        id: changes
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
          echo "functions=$(echo "$CHANGED" | grep -c 'functions/' || true)" >> $GITHUB_OUTPUT
          echo "rules=$(echo "$CHANGED" | grep -c 'database.rules.json' || true)" >> $GITHUB_OUTPUT

      - name: Install function dependencies
        if: steps.changes.outputs.functions != '0'
        run: npm install
        working-directory: functions

      - name: Deploy Functions
        if: steps.changes.outputs.functions != '0'
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only functions:generateCaption
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy Database Rules
        if: always() && (steps.changes.outputs.rules != '0' || github.event_name == 'workflow_dispatch')
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only database
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

