name: Deploy Firebase Functions

on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'database.rules.json'
      - 'firestore.rules'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install function dependencies
        if: contains(toJson(github.event.commits.*.modified), 'functions/')
        run: npm install
        working-directory: functions

      - name: Deploy Functions
        if: contains(toJson(github.event.commits.*.modified), 'functions/')
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only functions:generateCaption
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy Database Rules
        if: contains(toJson(github.event.commits.*.modified), 'database.rules.json') || github.event_name == 'workflow_dispatch'
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only database
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy Firestore Rules
        if: contains(toJson(github.event.commits.*.modified), 'firestore.rules') || github.event_name == 'workflow_dispatch'
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only firestore:rules
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
