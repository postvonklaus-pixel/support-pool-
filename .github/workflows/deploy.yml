name: Deploy Landing Page to GitHub Pages

# Deployt NUR die statische Landing Page (static/landing.html) zu GitHub
# Pages. GitHub Pages kann kein Python/Flask/Datenbank ausfuehren - das
# Backend (app.py / production.py) laeuft hier NICHT mit, siehe DEPLOY.md.
#
# Pages-Source ist auf "GitHub Actions" gestellt (Settings -> Pages ->
# "Build and deployment"). Vorher lief parallel Github's Legacy-Branch-Build
# ("pages build and deployment"), der bei jedem Push den Root-Inhalt von
# main (die alte Support-Pool-index.html) ausgeliefert und damit diesen
# Workflow-Deploy stillschweigend ueberschrieben hat - daher zeigte die
# Pages-URL bis eben die falsche Seite an.

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Pages-Ordner (landing.html -> index.html)
        run: |
          mkdir -p _site
          cp static/landing.html _site/index.html

      - name: Upload Pages-Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy zu GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
