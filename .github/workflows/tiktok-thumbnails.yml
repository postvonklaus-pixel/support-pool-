name: TikTok Thumbnails

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      retry:
        description: 'Retry failed videos (ignore 24h cooldown)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      force:
        description: 'Force re-fetch all (replace base64 with fresh CDN URLs)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

jobs:
  fetch-thumbnails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd .github/scripts
          npm init -y
          npm install firebase-admin node-fetch@2

      - name: Fetch thumbnails
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          RETRY: ${{ github.event.inputs.retry == 'true' && '1' || '0' }}
          FORCE: ${{ github.event.inputs.force == 'true' && '1' || '0' }}
        run: node .github/scripts/fetch-thumbnails.js
